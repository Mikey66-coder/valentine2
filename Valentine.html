<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will You Be My Valentine?</title>
    <style>
        body {
            background-color: #f0f0f0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            font-family: sans-serif;
        }

        .container {
            text-align: center;
            background-color: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #e91e63;
        }

        button {
            background-color: #e91e63;
            color: white;
            padding: 15px 30px;
            border: none;
            border-radius: 5px;
            font-size: 18px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #d81b60;
        }

        .heart {
            position: absolute;
            width: 50px;
            height: 45px; /* Adjusted for heart shape */
            background-color: red;
            transform: rotate(-45deg); /* Rotate to create heart shape */
            animation: float 4s linear infinite;
        }

        .heart::before, .heart::after {
            content: "";
            position: absolute;
            width: 50px;
            height: 45px;
            background-color: red;
            border-radius: 50%;
            top: -22.5px; /* Half the height, adjusted for rotation */
            left: 0;
        }
        .heart::after {
            left: 22.5px; /* Half the width, adjusted for rotation */
        }


        @keyframes float {
            0% { transform: translateY(100vh) rotate(-45deg); opacity: 0; }
            25% { opacity: 1; }
            100% { transform: translateY(-20vh) rotate(-45deg); opacity: 0; }
        }

    </style>
</head>
<body>
    <div class="container">
        <h1>Will You Be My Valentine?</h1>
        <button id="yesButton">Yes</button>
    </div>

    <script>
        const yesButton = document.getElementById('yesButton');

        yesButton.addEventListener('click', () => {
            for (let i = 0; i < 20; i++) {
                createHeart();
            }
            yesButton.disabled = true;
        });

        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDelay = Math.random() * 2 + 's';
            document.body.appendChild(heart);

            heart.addEventListener('animationend', () => {
                heart.remove();
            });
        }
    </script>

</body>
</html>
